name: Sync frozen-model actuals

on:
  schedule:
    - cron: "30 08 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-frozen-model-actuals
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh recent actual counts only
        run: python3 scripts/sync_validation_actuals.py --days 14 --embed-index
      - name: Publish refreshed validation actuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/latest_actuals.json index.html
          git diff --cached --quiet || git commit -m "Refresh frozen model validation actuals"
          git push
