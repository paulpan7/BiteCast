name: Sync boat tracks

on:
  schedule:
    # ~10:00 PM Pacific (PDT); shipfinder_playwright.py adds its own random
    # jitter of up to 30 minutes on top of whenever this actually fires, so
    # the scrape lands somewhere in the 10:00-10:30 PM window each night.
    - cron: "00 05 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-boat-tracks
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-shipfinder.txt
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements-shipfinder.txt') }}
      - name: Install Chromium (only on a cache miss -- the ~300MB download)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium
      - name: Install Chromium's OS packages (cache only covers the browser binary itself)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium
      - name: Run nightly ShipFinder export
        env:
          SHIPFINDER_EMAIL: ${{ secrets.SHIPFINDER_EMAIL }}
          SHIPFINDER_PASSWORD: ${{ secrets.SHIPFINDER_PASSWORD }}
          FLEETCAST_MMSI_FILE: data/fleetcast/mmsi.csv
          FLEETCAST_SKIP_JITTER: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python3 scripts/shipfinder_playwright.py
      - name: Upload run manifest (per-boat ok/error detail, for when the run log isn't enough)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipfinder-manifest
          path: data/fleetcast/manifests/*.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Publish refreshed bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fleetcast/bundle.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Refresh boat tracks bundle"
          # main can move between this job's checkout and this push (an
          # unrelated commit landing mid-run, or another trigger of this same
          # workflow) -- rebase onto the latest and retry rather than losing
          # the run's work outright.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5), rebasing onto latest main and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Failed to push after 5 attempts"
          exit 1
